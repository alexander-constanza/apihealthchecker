name: deploy

# Deploys to Fly on every push to main, but only after the test suite passes.
# The build runs on Fly's remote builders (--remote-only), so this needs no
# Docker daemon on the runner and no local network access to Fly.
#
# Requires one repository secret: FLY_API_TOKEN
#   Settings > Secrets and variables > Actions > New repository secret
#   Generate the value with: fly tokens create deploy -a <app-name>

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
        env:
          DATABASE_URL: "sqlite:///:memory:"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
